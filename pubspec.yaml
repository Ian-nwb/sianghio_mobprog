name: sianghio_mobprog
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  # TODO: Replace 'surname' in the name above with your own surname.
  # Example: name: castaneda_mobprog
  flutter_screenutil: ^5.9.3
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
  fonts:
    - family: Klavika
      fonts:
        - asset: assets/fonts/klavika-light.otf
          weight: 300
        - asset: assets/fonts/klavika-light-italic.otf
          weight: 300
          style: italic
        - asset: assets/fonts/klavika-regular-italic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/klavika-medium.otf
          weight: 500
        - asset: assets/fonts/klavika-medium-italic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/klavika-bold.otf
          weight: 700
        - asset: assets/fonts/klavika-bold-italic.otf
          weight: 700
          style: italic
    - family: Frutiger
      fonts:
        - asset: assets/fonts/FrutigerLTStd-Roman.otf
